name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Build, test and format
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: scripts/test.sh

      - name: Format lint
        run: swift format lint --strict -r Sources Tests Package.swift

      - name: Validate Info.plist
        run: plutil -lint Resources/Info.plist

  scripts-and-workflows:
    name: Lint scripts and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SHFMT_VERSION: v3.14.1
      ACTIONLINT_VERSION: v1.7.12
      ZIZMOR_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt and actionlint
        run: |
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: shfmt
        run: shfmt -i 2 -d scripts/*.sh

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --persona=regular .github/workflows
