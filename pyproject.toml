[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "writing-assistant"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
]

[project.scripts]
writing-assistant = "assistant.main:run"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["assistant"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest-asyncio>=1.4.0",
]
