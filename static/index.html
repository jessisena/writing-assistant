<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Writing Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Writing Assistant</h1>
      <p class="subtitle">Paste your text, choose a channel, and get polished English.</p>
    </header>

    <section class="input-section">
      <textarea
        id="input-text"
        class="input-textarea"
        placeholder="Paste your text here…"
        rows="8"
        aria-label="Text to polish"
      ></textarea>

      <fieldset class="channel-group" id="channel-group">
        <legend class="channel-legend">Channel</legend>
        <label class="channel-option">
          <input type="radio" name="channel" value="slack" />
          Slack message
        </label>
        <label class="channel-option">
          <input type="radio" name="channel" value="slack_informal" />
          Informal Slack message
        </label>
        <label class="channel-option">
          <input type="radio" name="channel" value="talking_points" />
          Sync / meeting talking points
        </label>
        <label class="channel-option">
          <input type="radio" name="channel" value="formal" checked />
          Formal document
        </label>
        <label class="channel-option">
          <input type="radio" name="channel" value="ai_prompt" />
          AI prompt
        </label>
        <label class="channel-option">
          <input type="radio" name="channel" value="other" />
          Other / general
        </label>
      </fieldset>

      <div class="submit-row">
        <button id="process-btn" class="btn-primary" type="button">
          <span class="btn-label">Process</span>
          <span class="btn-spinner" hidden aria-hidden="true"></span>
        </button>
        <span class="kbd-hint">or <kbd>⌘↵</kbd></span>
      </div>
    </section>

    <div id="error-banner" class="error-banner" hidden role="alert"></div>

    <section id="results" hidden aria-live="polite">
      <div class="card" id="polished-card">
        <div class="card-header">
          <h2 class="card-title">Polished Text</h2>
          <div class="card-meta" id="lang-label"></div>
          <button id="copy-btn" class="btn-copy" type="button">Copy</button>
        </div>
        <div class="card-body" id="polished-text"></div>
      </div>

      <div class="card" id="summary-card">
        <div class="card-header">
          <h2 class="card-title">English Learning Summary</h2>
        </div>
        <div class="card-body" id="summary-content"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
