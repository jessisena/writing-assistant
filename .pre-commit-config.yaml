# Run by prek (https://prek.j178.dev); `prek install` sets up the git hook.
# Hooks use the tools on your PATH: swift, shellcheck, shfmt, actionlint, zizmor.
repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift format lint
        entry: swift format lint --strict
        language: system
        types: [swift]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: shfmt -i 2 -d
        language: system
        types: [shell]

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/

      - id: zizmor
        name: zizmor
        entry: zizmor --persona=regular
        language: system
        files: ^\.github/

      - id: plist-lint
        name: plutil -lint
        entry: plutil -lint
        language: system
        files: \.plist$
